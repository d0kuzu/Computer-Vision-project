<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Распознавание цифр</title>
<style>
:root {
  color-scheme: light;
  font: 16px/1.5 Inter, "Segoe UI", system-ui, sans-serif;
  color: #17362f;
  background: #f5f6ef;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(100%, 840px); margin: clamp(28px, 8vh, 80px) auto; padding: 0 20px; }
h1, h2, p, figure { margin: 0; }
h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.08; letter-spacing: -.045em; }
h2 { font-size: 20px; line-height: 1.3; }
.intro { margin: 9px 0 24px; color: #50675f; }
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  padding: clamp(20px, 3.5vw, 32px);
  border: 1px solid #d9e2d8;
  border-radius: 18px;
  background: #fffefa;
}
.drawing { padding-right: 28px; }
.result { border-left: 1px solid #d9e2d8; padding-left: 28px; }
.pad {
  width: min(100%, 288px);
  margin-top: 14px;
  padding: 3px;
  border: 1px solid #aabdb2;
  border-radius: 10px;
  background: white;
}
canvas { width: 100%; height: auto; display: block; aspect-ratio: 1; touch-action: none; cursor: crosshair; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button { padding: 8px 13px; border: 1px solid transparent; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
#predict { background: #116248; color: white; }
#clear { border-color: #c9d6cd; background: transparent; color: #17362f; }
button:disabled { opacity: .48; cursor: default; }
button:focus-visible, summary:focus-visible { outline: 3px solid #d38253; outline-offset: 3px; }
#input-msg { margin-top: 8px; color: #963d2c; font-size: 14px; }
#input-msg:empty { margin: 0; }
#answer { display: block; font-size: clamp(64px, 8vw, 90px); line-height: 1.15; font-weight: 650; margin: 13px 0; }
#answer.empty { color: #a6b9ae; }
details { border-top: 1px solid #d9e2d8; padding-top: 12px; }
summary { color: #175c47; font-weight: 600; cursor: pointer; }
figure { margin: 12px 0; }
figure img { width: 100px; height: 100px; display: block; border: 1px solid #d9e2d8; border-radius: 6px; image-rendering: pixelated; }
figcaption, .stats { margin-top: 6px; font-size: 13px; color: #50675f; }
.stats { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
@media (max-width: 610px) {
  main { padding: 0 14px; }
  .workspace { grid-template-columns: 1fr; gap: 20px; }
  .drawing { padding-right: 0; }
  .result { padding: 15px 0 0; border-left: 0; border-top: 1px solid #d9e2d8; }
  #answer { margin: 5px 0; }
}
</style>
</head>
<body>
<main>
  <h1>Распознавание цифр</h1>
  <p class="intro">Нарисуйте одну цифру от 0 до 9 мышью или пальцем.</p>

  <div class="workspace">
    <section class="drawing" aria-labelledby="drawing-title">
      <h2 id="drawing-title">Рисунок</h2>
      <div class="pad"><canvas id="pad" width="280" height="280" aria-label="Поле для рисования цифры">Поле для рисования цифры</canvas></div>
      <div class="actions">
        <button id="predict" type="button" disabled>Распознать</button>
        <button id="clear" type="button" disabled>Очистить</button>
      </div>
      <p id="input-msg" role="status"></p>
    </section>

    <section class="result" aria-labelledby="result-title">
      <h2 id="result-title">Ответ модели</h2>
      <output id="answer" class="empty" aria-live="polite" aria-label="Распознанная цифра">—</output>
      <details id="explanation" hidden>
        <summary>Что повлияло на ответ?</summary>
        <figure>
          <img id="heat-map" alt="Тепловая карта штрихов">
          <figcaption id="caption"></figcaption>
        </figure>
        <p class="stats" id="latency"></p>
      </details>
    </section>
  </div>
</main>

<script>
"use strict";
const canvas = document.getElementById("pad");
const ctx = canvas.getContext("2d");
const predict = document.getElementById("predict");
const clear = document.getElementById("clear");
const answer = document.getElementById("answer");
const explanation = document.getElementById("explanation");
const heatMap = document.getElementById("heat-map");
const message = document.getElementById("input-msg");
let activePointer = null;
let hasInk = false;
let request = null;

function updateButtons() {
  predict.disabled = !hasInk || activePointer !== null || request !== null;
  predict.textContent = request ? "Распознаём…" : "Распознать";
  clear.disabled = !hasInk;
}

function resetResult() {
  if (request) request.abort();
  request = null;
  answer.textContent = "—";
  answer.classList.add("empty");
  explanation.hidden = true;
  explanation.open = false;
  heatMap.removeAttribute("src");
  message.textContent = "";
}

function clearCanvas() {
  if (activePointer !== null && canvas.hasPointerCapture(activePointer)) {
    canvas.releasePointerCapture(activePointer);
  }
  activePointer = null;
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  hasInk = false;
  resetResult();
  updateButtons();
}

function point(event) {
  const bounds = canvas.getBoundingClientRect();
  return [(event.clientX - bounds.left) * canvas.width / bounds.width,
          (event.clientY - bounds.top) * canvas.height / bounds.height];
}

canvas.onpointerdown = event => {
  if (activePointer !== null || event.button !== 0) return;
  event.preventDefault();
  activePointer = event.pointerId;
  canvas.setPointerCapture(activePointer);
  resetResult();
  const [x, y] = point(event);
  ctx.fillStyle = ctx.strokeStyle = "#000";
  ctx.lineWidth = 17;
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, y);
  hasInk = true;
  updateButtons();
};
canvas.onpointermove = event => {
  if (event.pointerId !== activePointer) return;
  ctx.lineTo(...point(event));
  ctx.stroke();
};
function endStroke(event) {
  if (event.pointerId !== activePointer) return;
  if (event.type === "pointerup") {
    ctx.lineTo(...point(event));
    ctx.stroke();
  }
  activePointer = null;
  updateButtons();
}
canvas.onpointerup = canvas.onpointercancel = canvas.onlostpointercapture = endStroke;
clear.onclick = clearCanvas;

function browserName() {
  const ua = navigator.userAgent;
  for (const [re, name] of [[/Edg\/(\d+)/, "Edge"], [/Firefox\/(\d+)/, "Firefox"],
                             [/Chrome\/(\d+)/, "Chrome"], [/Version\/(\d+).*Safari/, "Safari"]]) {
    const match = ua.match(re);
    if (match) return name + " " + match[1];
  }
  return "Браузер";
}

predict.onclick = async () => {
  if (predict.disabled) return;
  const current = new AbortController();
  request = current;
  message.textContent = "";
  updateButtons();
  try {
    const response = await fetch("/api/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({source: "draw", image: canvas.toDataURL("image/png")}),
      signal: current.signal
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Не удалось распознать цифру.");
    if (request !== current) return;
    answer.textContent = result.digit;
    answer.classList.remove("empty");
    heatMap.src = result.overlay;
    document.getElementById("caption").textContent = result.active
      ? "Красным отмечены штрихи, которые поддержали этот ответ."
      : "Для этой цифры модель не выделила выраженную область.";
    document.getElementById("latency").textContent =
      "Среднее время распознавания: " + result.mean_ms.toLocaleString("ru-RU", {maximumFractionDigits: 2}) +
      " мс · " + result.device + " · " + browserName();
    explanation.hidden = false;
  } catch (error) {
    if (!current.signal.aborted) {
      message.textContent = error instanceof TypeError ? "Нет связи с демо. Попробуйте ещё раз." : error.message;
    }
  } finally {
    if (request === current) {
      request = null;
      updateButtons();
    }
  }
};
clearCanvas();
</script>
</body>
</html>
